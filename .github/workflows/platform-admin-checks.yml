name: Platform Admin checks

on:
  push:
    branches:
      - feature/platform-admin-phase1-tenant
  pull_request:
    branches:
      - vyro-phase3-6-baseline

permissions:
  contents: read

concurrency:
  group: platform-admin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-only.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-fake-anon-key-not-secret-123456789012
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-only-fake-publishable-key-1234567890
          SUPABASE_SERVICE_ROLE_KEY: ci-only-fake-service-role-key-1234567890
          NEXT_PUBLIC_SITE_URL: https://vyro-2-two.vercel.app
          VERCEL_ENV: preview
